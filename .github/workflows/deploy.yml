name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Calcular siguiente version (patch)
        id: version
        run: |
          git fetch --tags
          LATEST_TAG=$(git tag -l "v0.2.*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="v0.2.1"
          else
            VERSION=${LATEST_TAG#v}
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)
            NEXT_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "next_tag=$NEXT_TAG" >> $GITHUB_OUTPUT
          echo "Siguiente version a desplegar: $NEXT_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Build versionado
        env:
          VITE_BASE_PATH: /tienda-ucjc-descubrimiento/${{ steps.version.outputs.next_tag }}/
        run: npm run build

      - name: Guardar carpeta de version en main
        run: |
          mkdir -p "${{ steps.version.outputs.next_tag }}"
          cp -r dist/* "${{ steps.version.outputs.next_tag }}/"

      - name: Build raiz (latest)
        env:
          VITE_BASE_PATH: /tienda-ucjc-descubrimiento/
        run: npm run build

      - name: Guardar raiz (latest) en main
        run: |
          cp -r dist/* ./
          touch .nojekyll

      - name: Commit, tag y push a main
        run: |
          git config user.name "release-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "release ${{ steps.version.outputs.next_tag }} [skip ci]"
            git tag "${{ steps.version.outputs.next_tag }}"
            git push origin main --tags
          fi