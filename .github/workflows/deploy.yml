name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Si es un tag (v0.2.1), pasa /tienda-ucjc-descubrimiento/v0.2.1/
          # Si es main, pasa /tienda-ucjc-descubrimiento/
          VITE_BASE_PATH: ${{ startsWith(github.ref, 'refs/tags/') && format('/tienda-ucjc-descubrimiento/{0}/', github.ref_name) || '/tienda-ucjc-descubrimiento/' }}
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Si es tag publica en la subcarpeta /v0.2.1; si es main publica en la raíz
          destination_dir: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          # No borra versiones anteriores ni la raíz
          keep_files: true
